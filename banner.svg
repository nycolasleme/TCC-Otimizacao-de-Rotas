<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="pheromone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eda100" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#eda100" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d1242f" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="260" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Malha viária estilizada (lado direito) -->
  <g stroke="#21262d" stroke-width="2" fill="none">
    <!-- Ruas horizontais -->
    <line x1="470" y1="45" x2="860" y2="45" />
    <line x1="470" y1="95" x2="860" y2="95" />
    <line x1="470" y1="145" x2="860" y2="145" />
    <line x1="470" y1="195" x2="860" y2="195" />
    <!-- Ruas verticais -->
    <line x1="500" y1="25" x2="500" y2="230" />
    <line x1="570" y1="25" x2="570" y2="230" />
    <line x1="640" y1="25" x2="640" y2="230" />
    <line x1="710" y1="25" x2="710" y2="230" />
    <line x1="780" y1="25" x2="780" y2="230" />
    <line x1="840" y1="25" x2="840" y2="230" />
  </g>

  <!-- Rota alternativa / feromônio secundário -->
  <path id="rota-alt" d="M 500,195 L 500,95 L 640,95 L 640,45 L 780,45 L 780,145 L 840,145 L 840,195 L 500,195" fill="none" stroke="#eda100" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Rota ótima (trilha principal de feromônio) -->
  <path id="rota-principal" d="M 500,195 L 570,195 L 570,145 L 640,145 L 640,95 L 710,95 L 710,45 L 780,45 L 780,195 L 500,195" fill="none" stroke="url(#pheromone)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite" />
  </path>

  <!-- Feixe animado percorrendo a rota (Formiga / Veículo) -->
  <path d="M 500,195 L 570,195 L 570,145 L 640,145 L 640,95 L 710,95 L 710,45 L 780,45 L 780,195 L 500,195" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 760">
    <animate attributeName="stroke-dashoffset" from="778" to="0" dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- Segunda formiga com defasagem -->
  <path d="M 500,195 L 570,195 L 570,145 L 640,145 L 640,95 L 710,95 L 710,45 L 780,45 L 780,195 L 500,195" fill="none" stroke="#ffdf5d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 768">
    <animate attributeName="stroke-dashoffset" from="778" to="0" dur="4.5s" begin="2.2s" repeatCount="indefinite" />
  </path>

  <!-- Evento de trânsito dinâmico pulsante (bloqueio evitado) -->
  <g transform="translate(640, 195)">
    <circle r="14" fill="#d1242f" fill-opacity="0.25">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.45;0.05;0.45" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="4.5" fill="#d1242f" />
    <text x="0" y="24" fill="#ff7b72" font-family="Segoe UI, Ubuntu, sans-serif" font-size="9" text-anchor="middle" font-weight="600">
      Trânsito (+5x)
    </text>
  </g>

  <!-- Paradas (nós azuis) -->
  <g fill="#58a6ff" stroke="#0d1117" stroke-width="2">
    <circle cx="570" cy="145" r="5.5" />
    <circle cx="640" cy="95" r="5.5" />
    <circle cx="710" cy="45" r="5.5" />
    <circle cx="780" cy="195" r="5.5" />
  </g>

  <!-- Depósito (quadrado destaque) -->
  <g transform="translate(500, 195)">
    <rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#3fb950" stroke="#0d1117" stroke-width="2" />
    <text x="0" y="22" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10" text-anchor="middle" font-weight="600">
      Depósito
    </text>
  </g>

  <!-- Textos Principais (lado esquerdo) -->
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif">
    <rect x="38" y="36" width="188" height="24" rx="12" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-opacity="0.4" />
    <text x="132" y="52" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">
      TCC · MOBILIDADE URBANA
    </text>

    <text x="38" y="102" fill="#f0f6fc" font-size="38" font-weight="800" letter-spacing="-0.5">
      🐜 RotaFormiga
    </text>

    <text x="40" y="134" fill="#c9d1d9" font-size="15.5" font-weight="400">
      Otimização e Reotimização Dinâmica de Rotas
    </text>
    <text x="40" y="156" fill="#8b949e" font-size="14">
      Colônia de Formigas (MAX-MIN ACO) · Dijkstra · A*
    </text>

    <!-- Pills de métricas/características -->
    <g transform="translate(40, 184)">
      <rect width="118" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="59" y="17" fill="#eda100" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Warm Start ACO</text>

      <rect x="128" width="124" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="190" y="17" fill="#3fb950" font-size="11.5" font-weight="600" text-anchor="middle">🗺️ Dígrafo Viário</text>

      <rect x="262" width="124" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="324" y="17" fill="#a371f7" font-size="11.5" font-weight="600" text-anchor="middle">📊 Streamlit + Plotly</text>
    </g>
  </g>
</svg>